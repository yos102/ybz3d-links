<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBZ3D - עיצוב והדפסה בתלת-מימד</title>
    
    <!-- ייבוא פונט עברי מודרני מגוגל -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- ייבוא אייקונים מ-FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* איפוס הגדרות בסיס */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f4f7f6; /* רקע בהיר ונקי */
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px; /* מותאם במיוחד למסכי סמארטפון */
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .header-section {
            margin-bottom: 40px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .brand-description {
            font-size: 16px;
            color: #666666;
            font-weight: 400;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* עיצוב כפתור בסיסי */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn i {
            font-size: 24px;
            margin-left: 12px; /* ריווח משמאל לאייקון בגלל RTL */
        }

        /* כפתור תשלום (Bit / PayBox) */
        .btn-pay {
            background-color: #00b0f0; /* כחול בולט שמתאים לאפליקציות תשלום */
        }

        /* כפתור אינסטגרם */
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* כפתור וואטסאפ */
        .btn-whatsapp {
            background-color: #25D366;
        }

        /* כפתור גלריה / אתר (אופציונלי להוספה עתידית) */
        .btn-website {
            background-color: #333333;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- כותרת ותיאור -->
        <div class="header-section">
            <h1 class="brand-name">YBZ3D</h1>
            <p class="brand-description">עיצוב והדפסה בתלת-מימד</p>
        </div>

        <!-- כפתורי פעולה -->
        <div class="buttons-container">
            
            <!-- החלף את '#' בקישור הרלוונטי לתשלום או במספר טלפון לביט -->
            <a href="https://www.bitpay.co.il/app/me/68A81515-7238-DDB0-9512-9B81C2990C7EA83F" class="btn btn-pay">
                <i class="fa-solid fa-shekel-sign"></i>
                לתשלום מהיר (Bit / PayBox)
            </a>

            <!-- החלף את '#' בקישור לפרופיל האינסטגרם שלך -->
            <a href="https://www.instagram.com/yossibenzimra?igsi=MXh1ZzRvbWMxenM3aw==" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i>
                לעמוד האינסטגרם שלנו
            </a>

            <!-- החלף את המספר בקישור הווצאפ שלך (כולל קידומת 972 ללא הפלוס) -->
            <a href="https://wa.me/972545454442" class="btn btn-whatsapp" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
                להזמנות אישיות בוואטסאפ
            </a>

        </div>

        <div class="footer">
            © כל הזכויות שמורות ל-YBZ3D
        </div>
    </div>

</body>
</html>
